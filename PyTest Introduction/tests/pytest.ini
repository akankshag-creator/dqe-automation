[pytest]
minversion = 7.0
testpaths =
    tests
# python_files
python_files = test_*.py
python_classes = Test*
python_functions = test_* check_*
# addopts
addopts = --strict-markers --tb=short
# marks
markers =
    unmarked: Tests that do not have any explicit marker
    validate_csv: Validate CSV schema and structure
log_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
console_output_style = progress
filterwarnings =
    ignore::DeprecationWarning
norecursedirs =
    .git
    node_modules
    build